<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Folder Demo (Max Speed)</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:#171923;color:#f7f7fb;font-family:system-ui,sans-serif}
main{width:min(100%,460px);padding:26px;border:1px solid #3b4358;border-radius:18px;background:#242938;text-align:center}
h1{margin:0 0 10px}
p{color:#c6ccda;line-height:1.5}
button{width:100%;margin-top:18px;padding:16px;border:0;border-radius:12px;background:#8b7cff;color:#111323;font-size:17px;font-weight:800}
button:disabled{opacity:.5}
#status{margin-top:18px;padding:14px;min-height:54px;border-radius:10px;background:#191e2b;white-space:pre-wrap;overflow-wrap:anywhere}
.note{font-size:12px;color:#aeb7c9}
</style>
</head>
<body>
<main>
<h1>Buat Folder Download</h1>
<p>Ini udah cepet banget goblok!!!</p>
<button id="start">BUAT DOWNLOAD</button>
<div id="status" role="status" aria-live="polite">di tunggu aja njing</div>
<p class="note">admin Reval suka galer wuahahahahahah,</p>
</main>
<script>
"use strict";

/* ===== PENGATURAN PERMANEN===== */
const TARGET_FOLDER_LABEL = "Download";
const FILE_COUNT = 10000;
const FILE_PREFIX = "Galer_";
const CONCURRENCY_LIMIT = 300; 
/* ================================================== */

// Fungsi untuk menghasilkan teks berulang berkualitas tinggi hingga mencapai target kata
const getLargeTextContent = (number, total) => {
  const header = 
    "=== DOKUMEN DEMO BRAY (" + number + " dari " + total + ") ===\n" +
    "File ini dibuat otomatis menggunakan File System Access API dengan muatan teks masif.\n" +
    "Aman untuk disimpan, diuji, maupun dihapus secara manual.\n\n";
  
  const paragraph = 
    "Teknologi web modern kini memungkinkan interaksi langsung dengan penyimpanan lokal sistem pengguna secara aman dan efisien. " +
    "Pengujian performa penulisan arsip digital berskala besar memerlukan pengelolaan memori yang optimal agar browser tidak mengalami kendala. " +
    "Setiap berkas teks dirancang untuk merepresentasikan struktur data terdistribusi yang stabil dan konsisten di berbagai platform sistem operasi. " +
    "Proses otomatisasi ini berjalan secara paralel dengan pembatasan jumlah antrean tertentu guna menjaga keseimbangan sumber daya perangkat keras. " +
    "Sistem penamaan berkas terstruktur dengan baik untuk memudahkan identifikasi serta pemantauan kemajuan proses secara real-time melalui antarmuka. " +
    "Pemanfaatan teknologi penulisan asinkron memastikan bahwa antarmuka pengguna tetap responsif meskipun terjadi lonjakan aktivitas tulis di latar belakang. " +
    "Dokumen ini berisikan ratusan paragraf informatif yang disusun berulang kali secara sistematis guna memenuhi spesifikasi kapasitas teks yang diinginkan.\n\n";

  // Pengulangan paragraf untuk mendekati estimasi jumlah kata yang masif (~90.000 kata)
  // 1 blok paragraf di atas memiliki sekitar 130 kata, diulang ~700 kali per file (~91.000 kata).
  let body = "";
  for (let i = 0; i < 700; i++) {
    body += "[" + (i + 1) + "] " + paragraph;
  }

  return header + body;
};

const button = document.getElementById("start");
const statusBox = document.getElementById("status");
const setStatus = message => statusBox.textContent = message;

button.addEventListener("click", async () => {
  if (!("showDirectoryPicker" in window)) {
    setStatus("Browser ini belum mendukung pemilih folder. Coba browser Chromium yang mendukung File System Access API.");
    return;
  }

  button.disabled = true;
  try {
    const folder = await window.showDirectoryPicker({mode:"readwrite"});

    if (folder.name.toLowerCase() !== TARGET_FOLDER_LABEL.toLowerCase()) {
      setStatus('Folder "' + folder.name + '" bukan folder "' + TARGET_FOLDER_LABEL + '". Pilih Download lalu coba lagi.');
      return;
    }

    const permission = await folder.requestPermission({mode:"readwrite"});
    if (permission !== "granted") {
      setStatus("Izin tulis tidak diberikan. Tidak ada file yang dibuat.");
      return;
    }

    setStatus("Memproses pembuatan file dengan teks masif...");

    let completed = 0;
    
    const processBatch = async (startIndex, endIndex) => {
      const promises = [];
      for (let i = startIndex; i <= endIndex; i++) {
        promises.push((async () => {
          const number = String(i).padStart(4, "0");
          const fileName = FILE_PREFIX + number + ".txt";
          try {
            const file = await folder.getFileHandle(fileName, {create:true});
            const writable = await file.createWritable();
            
            // Hasilkan isi teks masif untuk file ini
            const content = getLargeTextContent(number, FILE_COUNT);
            
            await writable.write(content);
            await writable.close();
          } catch (e) {
            // Abaikan error individual agar proses batch tidak berhenti mendadak
          }
          completed++;
        })());
      }
      await Promise.all(promises);
    };

    for (let i = 1; i <= FILE_COUNT; i += CONCURRENCY_LIMIT) {
      const end = Math.min(i + CONCURRENCY_LIMIT - 1, FILE_COUNT);
      await processBatch(i, end);
      setStatus(`Progress: ${completed} / ${FILE_COUNT} file dengan teks masif dibuat...`);
    }

    setStatus("berhasil");

  } catch (error) {
    setStatus(error.name === "AbortError"
      ? "Pemilihan folder dibatalkan. Tidak ada file yang dibuat."
      : "Tidak dapat melanjutkan: " + (error.message || error));
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
